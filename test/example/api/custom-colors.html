<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>API · 自定义颜色</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 24px; color: #24292f; }
        h3 { margin-top: 0; }
        pre { background: #f6f8fa; padding: 14px; border-radius: 6px; line-height: 1.6; }
        .label { font-size: 13px; color: #57606a; margin: 16px 0 4px; }
        a { color: #1e50b3; }
    </style>
</head>
<body>
    <h3>自定义颜色</h3>
    <p>通过 <code>colors</code> 参数覆盖对应语言默认色板的任意字段，未覆盖的字段仍取默认值。</p>

    <div class="label">默认色板（<code>Shader.shader()</code>）</div>
    <pre tag="javascript" id="a">// 默认颜色
const msg = "hello, world";
function add (a, b) { return a + b; }</pre>

    <div class="label">自定义色板（关键字绿、字符串紫、注释橙）</div>
    <pre id="b">// 自定义颜色
const msg = "hello, world";
function add (a, b) { return a + b; }</pre>

    <p><a href="../index.html">← 返回示例入口</a></p>

    <script src="../../../dist/shader.js"></script>
    <script>
        // 默认
        Shader.shader(document.getElementById("a"));

        // 自定义：用 toHTML 渲染后塞入 #b
        const src = "// 自定义颜色\nconst msg = \"hello, world\";\nfunction add (a, b) { return a + b; }";
        document.getElementById("b").innerHTML = Shader.toHTML("javascript", src, {
            key: "#008000",
            string: "#800080",
            annotation: "#ff8c00",
            funName: "#1e50b3",
            execName: "#1e83b1",
            insign: "#9e9e9e",
            text: "#000000"
        });
    </script>
</body>
</html>
