<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>API · 注册新语言</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 24px; color: #24292f; }
        h3 { margin-top: 0; }
        pre { background: #f6f8fa; padding: 14px; border-radius: 6px; line-height: 1.6; }
        .label { font-size: 13px; color: #57606a; margin: 16px 0 4px; }
        a { color: #1e50b3; }
    </style>
</head>
<body>
    <h3>Shader.registerLangHandler(handler, langIds?)</h3>
    <p>注册一个自定义语言。下面演示一个极简的 <code>todo</code> 语言：
       以 <code>#</code> 开头为注释，<code>- [x]</code> 已完成，<code>- [ ]</code> 待办。</p>

    <div class="label">着色效果</div>
    <pre id="demo"></pre>

    <p><a href="../index.html">← 返回示例入口</a></p>

    <script src="../../../dist/shader.js"></script>
    <script>
        // 颜色键自定义
        const colors = {
            comment: "#6a9955",
            done: "#9e9e9e",
            todo: "#ff0000",
            text: "#000000"
        };

        Shader.registerLangHandler({
            id: ["todo"],
            defaultColors: colors,
            tokenize(source, c) {
                const tokens = [];
                source.split("\n").forEach((line, idx) => {
                    if (idx > 0) tokens.push({ color: c.text, content: "\n" });
                    if (/^\s*#/.test(line)) {
                        tokens.push({ color: c.comment, content: line });
                    } else if (/^\s*-\s*\[x\]/.test(line)) {
                        tokens.push({ color: c.done, content: line });
                    } else if (/^\s*-\s*\[\s*\]/.test(line)) {
                        tokens.push({ color: c.todo, content: line });
                    } else {
                        tokens.push({ color: c.text, content: line });
                    }
                });
                return tokens;
            }
        }, ["todo"]);

        const src = [
            "# 我的待办",
            "- [x] 已完成的事项",
            "- [ ] 待处理的事项",
            "普通文本说明"
        ].join("\n");

        document.getElementById("demo").innerHTML = Shader.toHTML("todo", src);
    </script>
</body>
</html>
